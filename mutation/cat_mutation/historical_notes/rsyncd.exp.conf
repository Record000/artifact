# rsync daemon for the cure_asn1 comparison experiment
# Start:  rsync --daemon --config=rsyncd.exp.conf
# Serves the generated (and then mutated) repository tree so the patched
# validators can fetch it exactly like their original experiment.

pid file = /tmp/rsyncd-exp-cureasn1.pid
lock file = /tmp/rsyncd-exp-cureasn1.lock
port = 8730
address = 127.0.0.1

use chroot = no
read only = yes
list = yes

[myrpki]
    path = /home/xyf/research/RPKI/exp_cureasn1/harness/mutation/out/my_repo
    comment = cure_asn1 experiment repository
    read only = yes
    list = yes

[repo]
    path = /home/xyf/research/RPKI/artifact/my_repo/cache/localhost/repo
    comment = original artifact layout for control test
    read only = yes
    list = yes
